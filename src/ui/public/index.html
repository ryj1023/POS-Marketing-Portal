<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>POS Internal Dashboard</title>
    <style>
      :root {
        --bg: #ededeb;
        --card: #f8f8f6;
        --border: #d4d4d1;
        --text: #171717;
        --muted: #525252;
        --up: #256b2c;
        --down: #8c2f29;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "SF Mono", "Consolas", "Menlo", monospace;
        color: var(--text);
        background: var(--bg);
      }
      main {
        max-width: 1500px;
        margin: 0 auto;
        padding: 24px;
      }
      .top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }
      h1 { margin: 0; font-size: 46px; letter-spacing: -1px; }
      .meta { margin-top: 6px; color: #404040; font-size: 20px; }
      .badge {
        border: 1px solid #5f8445;
        color: #2b5f2d;
        padding: 8px 18px;
        border-radius: 999px;
        font-size: 40px;
        line-height: 1;
      }
      .hr { height: 1px; background: var(--border); margin: 20px 0 16px; }
      .warning {
        margin: 12px 0;
        padding: 12px 14px;
        border-radius: 10px;
        background: #fff7d6;
        border: 1px solid #f6d564;
        font-size: 22px;
      }
      .import-card { margin-bottom: 16px; }
      .dropzone {
        border: 2px dashed #b8b8b5;
        border-radius: 14px;
        padding: 14px;
        background: #f3f3f1;
      }
      .dropzone.dragover {
        border-color: #3f86d0;
        background: #eaf2fb;
      }
      .import-row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .import-btn {
        border: 1px solid #9ca3af;
        border-radius: 10px;
        background: #fff;
        padding: 7px 12px;
        font: inherit;
        cursor: pointer;
      }
      .import-status {
        margin-top: 8px;
        font-size: 14px;
        color: #404040;
      }
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 20px;
      }
      .kpi-title { color: #3f3f46; font-size: 18px; letter-spacing: 1px; }
      .kpi-value { font-size: 48px; font-weight: 700; margin-top: 8px; }
      .kpi-delta { margin-top: 8px; font-size: 19px; }
      .up { color: var(--up); }
      .down { color: var(--down); }
      .two-col {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 16px;
        margin-top: 16px;
      }
      .title { font-size: 20px; letter-spacing: 2px; margin: 0 0 14px; }
      .seller-row {
        display: grid;
        grid-template-columns: minmax(220px, 1.4fr) minmax(220px, 1.6fr) 110px;
        gap: 12px;
        align-items: center;
        padding: 9px 0;
      }
      .seller-units {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .track {
        background: #e6e5e1;
        border-radius: 999px;
        height: 16px;
        overflow: hidden;
      }
      .bar {
        height: 100%;
        border-radius: 999px;
      }
      .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
      .legend-item { display: inline-flex; align-items: center; gap: 7px; font-size: 16px; }
      .swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
      .chart-wrap { width: 100%; display: flex; justify-content: center; }
      .line-card { margin-top: 16px; }
      .line-chart-wrap { width: 100%; height: 300px; }
      .line-chart { width: 100%; height: 100%; }
      .bottom {
        margin-top: 16px;
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 16px;
      }
      .equal-height-card {
        height: 520px;
        display: flex;
        flex-direction: column;
      }
      .scroll-body {
        min-height: 0;
        overflow-y: auto;
        padding-right: 4px;
      }
      .pill {
        display: inline-block;
        background: #dbe5f1;
        color: #2f5d95;
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 16px;
        margin-bottom: 10px;
      }
      .rec-item { border-top: 1px solid var(--border); padding: 12px 0; }
      .rec-item:first-of-type { border-top: none; }
      .rec-title { display: flex; justify-content: space-between; gap: 8px; font-size: 21px; font-weight: 700; }
      .rec-note { font-size: 17px; color: #404040; line-height: 1.35; margin-top: 6px; }
      .tx-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        padding: 12px 0;
        border-top: 1px solid var(--border);
      }
      .tx-row:first-of-type { border-top: none; }
      .tx-main { font-size: 24px; }
      .tx-sub { color: #404040; font-size: 18px; margin-top: 4px; }
      .tx-amount { font-size: 24px; font-weight: 700; }
      .panel-state { color: var(--muted); font-size: 15px; margin-top: 6px; }
      @media (max-width: 1100px) {
        h1 { font-size: 34px; }
        .badge { font-size: 26px; }
        .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .two-col, .bottom { grid-template-columns: 1fr; }
        .equal-height-card { height: auto; }
        .scroll-body { overflow-y: visible; }
        .tx-amount { font-size: 24px; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="top" aria-label="Dashboard header">
        <div>
          <h1 id="title">POS Internal Dashboard</h1>
          <div id="meta" class="meta"></div>
        </div>
        <div class="badge" aria-label="Live status">LIVE</div>
      </section>
      <div class="hr"></div>
      <section class="card import-card" aria-label="Import JSON transactions">
        <h2 class="title">IMPORT TRANSACTIONS JSON</h2>
        <div id="dropzone" class="dropzone">
          <div class="import-row">
            <button id="pick-file" class="import-btn" type="button">Choose JSON File</button>
            <span>or drag and drop a `.json` file here</span>
          </div>
          <input id="file-input" type="file" accept="application/json,.json" hidden />
          <div id="import-status" class="import-status">Using generated mock dataset.</div>
        </div>
      </section>
      <div id="warning" class="warning" hidden></div>
      <section aria-label="KPI strip">
        <div id="kpis" class="kpi-grid"></div>
      </section>
      <section class="two-col" aria-label="Top panels">
        <article class="card">
          <h2 class="title">BEST SELLING ITEMS - UNITS TODAY</h2>
          <div id="best-sellers"></div>
          <div id="best-state" class="panel-state"></div>
        </article>
        <article class="card">
          <h2 class="title">UNITS SOLD BY CATEGORY</h2>
          <div id="category-legend" class="legend"></div>
          <div id="category-donut" class="chart-wrap"></div>
          <div id="category-state" class="panel-state"></div>
        </article>
      </section>

      <section class="card line-card" aria-label="Hourly quantity chart">
        <h2 class="title">HOURLY QUANTITY SOLD</h2>
        <div class="line-chart-wrap">
          <canvas id="line-chart" class="line-chart" role="img" aria-label="Units sold trend"></canvas>
        </div>
        <div id="trend-state" class="panel-state"></div>
      </section>

      <section class="bottom" aria-label="Bottom panels">
        <article class="card equal-height-card">
          <h2 class="title">PROMOTION SUGGESTIONS</h2>
          <div class="pill" id="rec-meta">Rule-based engine</div>
          <div id="recs" class="scroll-body"></div>
          <div id="rec-state" class="panel-state"></div>
        </article>
        <article class="card equal-height-card">
          <h2 class="title">RECENT TRANSACTIONS</h2>
          <div id="transactions" class="scroll-body"></div>
          <div id="tx-state" class="panel-state"></div>
        </article>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="/main.js"></script>
  </body>
  </html>
